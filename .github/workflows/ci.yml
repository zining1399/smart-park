name: smart-park CI

# 触发：主干/开发分支推送与 PR、语义化版本 tag
on:
  push:
    # master 是本仓唯一长期分支（origin/master），必须列入：只写 main/develop 时
    # 本 workflow 从未被任何推送触发过，下面 6 个 job 的"绿"全部是无记录的绿
    branches: [master, main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [master, main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}    # owner/smart-park

jobs:
  # ------------------------------------------------- 运维脚本自检（无需 docker）
  scripts:
    name: 运维脚本自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 四条失败路径 + 一条正常路径：编码/业务键/枚举/列名 + 事务原子性断言
      # 说明：这些是"真跑才能暴露"的问题（py_compile 查不出逻辑错误），故纳入 CI
      - name: csv-to-inserts.py 自检
        run: |
          set -u
          cd scripts
          mkdir -p /tmp/t && cd /tmp/t
          S=../../scripts/csv-to-inserts.py
          COLS='emp_no,name,dept,phone,status'

          print_result(){ echo "$1"; }

          # ① 正常路径：exit 0 且含 COMMIT，业务键大写归一
          printf 'emp_no,name,dept,phone,status\ne1001,张三,技,,在职\n' > ok.csv
          python3 $S employee "$COLS" ok.csv > ok.sql; rc=$?
          [ $rc -eq 0 ] || { echo "::error::正常路径退出码 $rc"; exit 1; }
          grep -q 'COMMIT;' ok.sql || { echo "::error::缺少 COMMIT"; exit 1; }
          grep -q "'E1001'" ok.sql || { echo "::error::业务键未大写归一"; exit 1; }

          # ② 列名校验：列序打乱必须中止（默认严格）
          printf 'name,emp_no,dept,phone,status\n张三,E1,技,,在职\n' > shuffle.csv
          python3 $S employee "$COLS" shuffle.csv >/dev/null 2>&1; rc=$?
          [ $rc -eq 4 ] || { echo "::error::列序打乱未中止（rc=$rc）"; exit 1; }

          # ③ 业务键为空：exit 4 且不写 COMMIT（事务原子性）
          printf 'emp_no,name,dept,phone,status\n,张三,技,,在职\n' > badkey.csv
          python3 $S employee "$COLS" badkey.csv --keys emp_no > badkey.sql 2>/dev/null; rc=$?
          [ $rc -eq 4 ] || { echo "::error::业务键为空未中止（rc=$rc）"; exit 1; }
          grep -q 'COMMIT;' badkey.sql && { echo "::error::中止时不应包含 COMMIT"; exit 1; }

          # ④ 枚举非法：exit 4
          printf 'emp_no,name,dept,phone,status\nE1,张三,技,,未知\n' > badenum.csv
          python3 $S employee "$COLS" badenum.csv --enum 'status=在职,离职' >/dev/null 2>&1; rc=$?
          [ $rc -eq 4 ] || { echo "::error::枚举非法未中止（rc=$rc）"; exit 1; }

          # ⑤ 非 UTF-8：exit 4（且不得自动转码）
          python3 -c "open('gbk.csv','wb').write('emp_no,name,dept,phone,status\nE1,张三,技,,在职\n'.encode('gbk'))"
          python3 $S employee "$COLS" gbk.csv >/dev/null 2>&1; rc=$?
          [ $rc -eq 4 ] || { echo "::error::非 UTF-8 未中止（rc=$rc）"; exit 1; }

          echo "✅ 运维脚本自检通过（5 条路径）"

      # 归档 SQL 静态校验（纯文本，无需 MySQL）：破坏性语句 / INSERT-DELETE 谓词一致 /
      # 确定性排序 / ROW_COUNT 位置 / stock_record 完结条件
      - name: 归档 SQL 静态校验
        working-directory: .
        run: python3 scripts/archive-lint.py docs/ops/archive.sql

      # 现场脚本语法检查：CRLF 或手滑漏引号在 Linux 上表现为 bad interpreter / 静默错行，
      # 在本地没有 docker 的情况下这是唯一能提前挡住的手段
      - name: 运维脚本语法检查（bash -n）
        run: |
          set -x
          for f in scripts/*.sh mysql/init/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done
          echo "bash -n loop done, last rc=$?"

  # ---------------------------------------------------------------- 后端
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_park
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # 集成测试直连 MySQL service container（不用 Testcontainers，避免 Docker 版本兼容问题）
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/smart_park?connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven                     # Maven 依赖缓存
      - name: 编译 + 单元测试
        working-directory: smart-park-backend
        run: mvn -B clean verify
      # 假绿守卫：集成用例基类是 @Testcontainers(disabledWithoutDocker = true)，runner 上
      # Docker 不可用时整类被记为 skipped 而 mvn 退出码仍为 0，"BUILD SUCCESS" 里可能一条
      # 集成用例都没跑 —— 鉴权矩阵 168 断言、CHECK 矩阵 40 断言、审计日志、账号禁用即时生效
      # 全在这些类里，跳过即视为未验证，本 job 必须红（2026-10-27 归档表 DROP CHECK 缺陷
      # 就是靠这条门禁才不会被静默带到交付）。判据与逐类白名单见脚本头部注释。
      - name: 集成用例不得被静默跳过（假绿守卫）
        run: bash scripts/check-surefire-no-skip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: smart-park-backend/target/*.jar
          retention-days: 7

  # ---------------------------------------------------------------- 前端
  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: smart-park-frontend/package-lock.json
      # package-lock.json 必须存在（缺即 fail）：可重复构建依赖锁定，
      # 不允许静默回退 npm install —— 否则交付版本与验收版本可能不一致
      - name: 依赖安装（npm ci，锁定依赖）
        working-directory: smart-park-frontend
        run: |
          test -f package-lock.json || { echo "::error::缺少 package-lock.json"; exit 1; }
          npm ci
      - name: 前端测试（用例就绪后自动生效）
        working-directory: smart-park-frontend
        run: npm run test --if-present
      - name: 构建
        working-directory: smart-park-frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: smart-park-frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------- 镜像
  images:
    name: 镜像构建与推送
    needs: [backend, frontend]              # 质量门禁：测试不过不出镜像
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
      - name: 构建并推送后端镜像
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: smart-park-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: 构建并推送前端镜像
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: smart-park-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ★ 镜像自检：backend 容器 healthcheck 依赖 curl，
      #   缺失会导致容器永远 unhealthy → frontend 因 depends_on 永不启动
      - name: 镜像自检（curl 存在性）
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
          docker pull "$IMG"
          # --entrypoint 绕过 Spring Boot 启动（无 MySQL 会直接 exit 1），只验证 curl 在不在
          docker run --rm --entrypoint which "$IMG" curl
          echo "✅ 镜像内含 curl，healthcheck 可用"

  # ------------------------------------------------- 真实容器冒烟（补齐静态校验盲区）
  # 静态校验挡不住 compose 网络、init 时序、healthcheck、Flyway 首迁这类问题，
  # 这里用一次真跑把它们兜住；断言全在 scripts/smoke.sh，失败即 job 失败
  smoke:
    name: 真实容器冒烟
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取镜像并落到 compose 期望的本地 tag
        run: |
          set -eu
          V=${{ needs.images.outputs.version }}
          P=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          docker pull "$P-backend:$V"
          docker pull "$P-frontend:$V"
          docker tag "$P-backend:$V"   "smart-park-backend:$V"
          docker tag "$P-frontend:$V"  "smart-park-frontend:$V"
      - name: 生成现场配置（一次性随机密钥，仅 runner 内存，不入制品）
        run: |
          set -eu
          V=${{ needs.images.outputs.version }}
          cp .env.example .env
          {
            echo "APP_VERSION=$V"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -base64 24)"
            echo "MYSQL_APP_PASSWORD=$(openssl rand -base64 24)"
            echo "MYSQL_MIG_PASSWORD=$(openssl rand -base64 24)"
            echo "MYSQL_BAK_PASSWORD=$(openssl rand -base64 24)"
            echo "SMARTPARK_JWT_SECRET=$(openssl rand -base64 48)"
          } >> .env
          chmod 600 .env
          bash scripts/init-secrets.sh
      - name: 冒烟断言（scripts/smoke.sh）
        run: bash scripts/smoke.sh
      - name: 收尾下线（runner 一次性，销毁不影响任何真实数据）
        if: always()
        run: docker compose --env-file .env down -v || true

  # ---------------------------------------------------------------- 交付包
  release:
    name: 发布离线交付包（人工审批）
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production                 # 在 GitHub Environments 配置 required reviewer
    steps:
      - uses: actions/checkout@v4
      - name: 打包离线交付物（镜像 tar + compose 全套）
        run: |
          V=${GITHUB_REF_NAME#v}
          P=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          docker pull "$P-backend:$V"
          docker pull "$P-frontend:$V"
          docker pull mysql:8.0.39
          mkdir -p release/images release/scripts
          docker save "$P-backend:$V" "$P-frontend:$V" mysql:8.0.39 \
            | gzip > release/images/smart-park-images.tar.gz
          cp docker-compose.yml .env.example release/
          cp -r mysql release/
          cp -r scripts release/
          echo "APP_VERSION=$V" >> release/.env.example
          echo "VERSION=$V" > release/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smart-park-release-${{ github.ref_name }}
          path: release
          retention-days: 90
