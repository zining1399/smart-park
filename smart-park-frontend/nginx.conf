# smart-park 前端 Nginx 配置
# 被 smart-park-frontend/Dockerfile 拷贝为 /etc/nginx/conf.d/default.conf
# 要点：SPA history fallback、/api 同域反代（前端零 CORS 依赖）、assets 长缓存、
#       index.html 禁缓存、gzip、/api/actuator/ 除 health 外一律 403

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;          # 上传限制（访客照片/物料图片等）

    # -------- 压缩 --------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # 前端构建已产出同名 .gz（vite-plugin-compression），命中即直接吐压缩包，省 CPU
    gzip_static on;                       # nginx:1.27-alpine 官方镜像自带 http_gzip_static_module

    root /usr/share/nginx/html;
    index index.html;

    # -------- 带 hash 的静态资源：长缓存 --------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------- SPA 入口：禁止缓存，避免发版后浏览器仍用旧 index.html --------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # -------- Actuator：只放行 health --------
    # 注意：即使后端 exposure 扩到 metrics/prometheus，此处仍 403（三层收口的最外层）
    location = /api/actuator/health {
        proxy_pass http://backend:8080/api/actuator/health;
        access_log off;
    }
    location /api/actuator/ {
        return 403;
    }

    # -------- 业务 API 同域反代（context-path 即 /api，无需重写路径）--------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -------- SPA history fallback：解决刷新 404 --------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
