# 开发/本地环境：H2 内存数据库（免装 MySQL，启动即建表 + 演示数据）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smart-park;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  # 开发环境关掉 Flyway（Flyway 脚本是 MySQL 语法，H2 不兼容）
  flyway:
    enabled: false
  # 启动时自动执行 schema.sql 建表 + data.sql 演示数据
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  # H2 控制台：http://localhost:8080/api/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

# dev 兜底：未注入 env 时使用本地开发密钥（生产 profile 不含任何默认值，缺失即 fail-fast）
smartpark:
  security:
    jwt-secret: ${SMARTPARK_JWT_SECRET:dev-only-insecure-jwt-secret-please-override-in-env-0123456789}
    cors-origins: ${SMARTPARK_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  crypto:
    # 注意：key 必须是 Base64 编码的 32 字节串（下为 0x00-0x1F 的 Base64，仅 dev 使用）
    key: ${SMARTPARK_CRYPTO_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    hmac-key: ${SMARTPARK_CRYPTO_HMAC_KEY:dev-only-hmac-key-please-override}

logging:
  level:
    com.smartpark: debug
